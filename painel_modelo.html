<title>Segundo Turno 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  color-scheme: light;
  --plano:#f9f9f7;  --superficie:#fcfcfb;  --superficie-2:#f2f1ec;
  --tinta:#0b0b0b;  --tinta-2:#52514e;  --tinta-3:#898781;
  --grade:#e1e0d9;  --eixo:#c3c2b7;  --borda:rgba(11,11,11,.10);
  --a:#e34948;      /* Lula   */
  --b:#2a78d6;      /* Flávio */
  --alerta:#d03b3b;
  --realce:#f0efec;
  --sombra:0 1px 2px rgba(11,11,11,.05);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plano:#0d0d0d;  --superficie:#1a1a19;  --superficie-2:#242422;
    --tinta:#ffffff;  --tinta-2:#c3c2b7;  --tinta-3:#898781;
    --grade:#2c2c2a;  --eixo:#383835;  --borda:rgba(255,255,255,.10);
    --a:#e66767;  --b:#3987e5;  --alerta:#e66767;
    --realce:#232321;  --sombra:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plano:#0d0d0d;  --superficie:#1a1a19;  --superficie-2:#242422;
  --tinta:#ffffff;  --tinta-2:#c3c2b7;  --tinta-3:#898781;
  --grade:#2c2c2a;  --eixo:#383835;  --borda:rgba(255,255,255,.10);
  --a:#e66767;  --b:#3987e5;  --alerta:#e66767;
  --realce:#232321;  --sombra:none;
}

*{box-sizing:border-box}
body{margin:0; background:var(--plano); color:var(--tinta);
  font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
.envoltorio{max-width:1020px; margin:0 auto; padding-inline:20px; padding-block:0 72px}
h1,h2,h3{text-wrap:balance; margin:0}
:focus-visible{outline:2px solid var(--b); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

.masthead{padding-block:44px 24px}
.selo{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--tinta-3); margin-bottom:14px}
.masthead h1{font-family:var(--serif); font-weight:600; font-size:clamp(34px,6vw,52px);
  line-height:1.04; letter-spacing:-.015em}
.subtitulo{font-family:var(--serif); font-size:clamp(16px,2.2vw,19px); font-style:italic;
  color:var(--tinta-2); margin-top:12px; max-width:62ch}
.metalinha{display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:20px;
  font-family:var(--mono); font-size:12px; color:var(--tinta-2)}
.metalinha b{color:var(--tinta); font-weight:500}

/* --------------------------------------------------- aviso de hipotético */
.alarme{
  margin-top:22px; padding:16px 18px; border-radius:10px;
  background:var(--superficie); border:1px solid var(--borda);
  border-left:3px solid var(--alerta); font-size:13.5px; line-height:1.6;
  color:var(--tinta-2);
}
.alarme b{color:var(--tinta)}
.alarme .titulo{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--alerta); margin-bottom:7px;
}

/* --------------------------------------------------- placar */
.placar{margin-top:26px; background:var(--superficie); border:1px solid var(--borda);
  border-radius:12px; padding:26px; box-shadow:var(--sombra)}
.duelo{display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:end}
@media (max-width:620px){.duelo{grid-template-columns:1fr; gap:10px}}
.lado .nome{font-size:15px; font-weight:500; margin-bottom:4px}
.lado .pct{font-family:var(--serif); font-size:clamp(40px,8vw,60px); font-weight:600;
  line-height:1; letter-spacing:-.02em}
.lado .mg{font-family:var(--mono); font-size:12px; color:var(--tinta-3); margin-top:6px}
.lado.dir{text-align:right}
@media (max-width:620px){.lado.dir{text-align:left}}
.versus{font-family:var(--serif); font-style:italic; font-size:19px; color:var(--tinta-3);
  padding-bottom:10px}
.barra-duelo{display:flex; height:30px; border-radius:5px; overflow:hidden; gap:2px;
  margin-top:20px}
.barra-duelo span{display:flex; align-items:center; font-family:var(--mono); font-size:12.5px;
  font-weight:600; color:#fff; padding-inline:11px; transition:width .35s}
.barra-duelo .dir{justify-content:flex-end}
.linha50{position:relative; height:14px; margin-top:-2px}
.linha50 i{position:absolute; left:50%; top:0; width:1px; height:9px; background:var(--tinta-3)}
.linha50 span{position:absolute; left:50%; top:9px; transform:translateX(-50%);
  font-family:var(--mono); font-size:10px; color:var(--tinta-3)}
.veredito{margin-top:22px; padding-top:16px; border-top:1px solid var(--grade);
  font-size:14px; color:var(--tinta-2)}
.veredito b{color:var(--tinta)}

/* --------------------------------------------------- seções */
.secao{padding-block:40px 0}
.secao h2{font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:-.01em}
.secao .nota{color:var(--tinta-2); font-size:13.5px; max-width:70ch; margin:6px 0 20px}
.secao .nota b{color:var(--tinta)}
.secao .nota code{font-family:var(--mono); font-size:12.5px; background:var(--realce);
  padding:1px 5px; border-radius:3px}
.cartao{background:var(--superficie); border:1px solid var(--borda); border-radius:10px;
  padding:22px; box-shadow:var(--sombra)}

/* --------------------------------------------------- gráfico */
.moldura{position:relative; width:100%}
.moldura svg{display:block; width:100%; height:auto; overflow:visible}
#g .grade{stroke:var(--grade); stroke-width:1}
#g .meio{stroke:var(--tinta-3); stroke-width:1; stroke-dasharray:4 3}
#g text{font-family:var(--mono); font-size:11px; fill:var(--tinta-3)}
#g .rotmeio{fill:var(--tinta-2); font-weight:600}
#g .la{stroke:var(--a)} #g .lb{stroke:var(--b)}
#g .ln{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
#g .pa{fill:var(--a)} #g .pb{fill:var(--b)}
#g .pt{opacity:.34; stroke:var(--superficie); stroke-width:1.5}
#g .fim{stroke:var(--superficie); stroke-width:2}
#g .ra{fill:var(--a)} #g .rb{fill:var(--b)}
#g .rot{font-family:var(--sans); font-size:12px; font-weight:600}
#g .cruz{stroke:var(--eixo); stroke-width:1}
#g .corte{stroke:var(--tinta-3); stroke-width:1; stroke-dasharray:2 3}
.legenda{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:14px; font-size:12.5px;
  color:var(--tinta-2)}
.legenda span{display:inline-flex; align-items:center; gap:7px}
.marca{width:13px; height:3px; border-radius:2px; flex:none}
.dica{position:absolute; pointer-events:none; z-index:5; opacity:0;
  background:var(--superficie); border:1px solid var(--borda); border-radius:7px;
  padding:9px 11px; box-shadow:0 3px 14px rgba(0,0,0,.13); min-width:140px; transition:opacity .1s}
.dica.vis{opacity:1}
.dica-data{font-family:var(--mono); font-size:11px; color:var(--tinta-3); margin-bottom:6px}
.dica-linha{display:flex; align-items:center; gap:7px; font-size:12.5px; white-space:nowrap}
.dica-linha .v{margin-left:auto; font-family:var(--mono); font-weight:600}

/* --------------------------------------------------- tabelas */
.rolagem{overflow-x:auto; border:1px solid var(--borda); border-radius:10px;
  background:var(--superficie)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:9px 12px; text-align:right; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--tinta-3); font-weight:500; border-bottom:1px solid var(--eixo);
  background:var(--superficie)}
td{border-bottom:1px solid var(--grade); font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--realce)}
td.num{font-family:var(--mono)}
.barra-peso{position:relative; min-width:110px}
.barra-peso i{position:absolute; left:0; top:50%; transform:translateY(-50%); height:13px;
  background:var(--b); opacity:.25; border-radius:0 3px 3px 0}
.barra-peso span{position:relative; font-family:var(--mono)}
.erro{font-family:var(--mono); font-size:11.5px}
.erro.bom{color:var(--tinta)} .erro.ruim{color:var(--tinta-3)}
.pastilha{display:inline-block; font-family:var(--mono); font-size:10px; padding:1px 6px;
  border-radius:4px; background:var(--superficie-2); border:1px solid var(--borda);
  color:var(--tinta-3); margin-left:6px}

.rodape{margin-top:52px; padding-top:24px; border-top:1px solid var(--eixo);
  font-size:12.5px; color:var(--tinta-3); line-height:1.65}
.rodape b{color:var(--tinta-2); font-weight:500}
.rodape p{margin:0 0 11px}
</style>

<div class="envoltorio">

  <header class="masthead">
    <div class="selo" id="selo"></div>
    <h1 id="titulo"></h1>
    <p class="subtitulo" id="subtitulo"></p>
    <div class="metalinha" id="metalinha"></div>
    <div class="alarme" id="alarme" hidden></div>
  </header>

  <div class="placar">
    <div class="duelo" id="duelo"></div>
    <div class="barra-duelo" id="barra"></div>
    <div class="linha50"><i></i><span>50%</span></div>
    <div class="veredito" id="veredito"></div>
  </div>

  <section class="secao">
    <h2>Como a corrida se moveu</h2>
    <p class="nota" id="nota-grafico"></p>
    <div class="cartao">
      <div class="legenda" id="legenda"></div>
      <div class="moldura" id="moldura">
        <svg id="g" viewBox="0 0 900 320" role="img"
             aria-label="Evolução do 2º turno em votos válidos"></svg>
        <div class="dica" id="dica"></div>
      </div>
    </div>
  </section>

  <section class="secao">
    <h2>Quem errou quanto no 1º turno</h2>
    <p class="nota" id="nota-acuracia"></p>
    <div class="rolagem">
      <table>
        <thead><tr>
          <th>Instituto</th><th>Campo</th><th>Previu</th><th>Erro na margem</th><th>Peso daqui</th>
        </tr></thead>
        <tbody id="corpo-acuracia"></tbody>
      </table>
    </div>
  </section>

  <section class="secao">
    <h2>As pesquisas que entram na média</h2>
    <p class="nota" id="nota-pesquisas"></p>
    <div class="rolagem">
      <table>
        <thead><tr id="cab-pesquisas"></tr></thead>
        <tbody id="corpo-pesquisas"></tbody>
      </table>
    </div>
  </section>

  <footer class="rodape" id="rodape"></footer>
</div>

<script type="application/json" id="dados">/*__DADOS__*/</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const A = D.duelo.a, B = D.duelo.b, AG = D.agregado;

const nf1 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat("pt-BR");
const sinal = v => (v>0?"+":v<0?"−":"") + nf1.format(Math.abs(v));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const DIA = 86400000;
const dt = s => new Date(s+"T00:00:00Z").getTime();
const dCurta = t => new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",timeZone:"UTC"});
const dLonga = t => new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric",timeZone:"UTC"});

const DIA1T = dt(D.dia_1t), DIA2T = dt(D.dia_2t), HOJE = dt(D.data_ultima_pesquisa);
const faltam = Math.round((DIA2T - Date.now()) / DIA);

/* ------------------------------------------------------------ cabeçalho */
document.getElementById("selo").textContent =
  `2º turno · ${dLonga(DIA2T)} · votos válidos`;
document.getElementById("titulo").textContent = `${A} × ${B}`;
document.getElementById("subtitulo").innerHTML =
  `A média das pesquisas do 2º turno, com o peso de cada instituto definido pelo
   que ele errou no 1º turno — e não por nota dada antes da eleição.`;

document.getElementById("metalinha").innerHTML =
  `<span>Pesquisa mais recente <b>${dLonga(HOJE)}</b></span>` +
  `<span><b>${AG.n}</b> pesquisas na janela</span>` +
  `<span><b>${nf1.format(AG.n_efetivo)}</b> efetivas</span>` +
  (faltam > 0 ? `<span><b>${faltam}</b> dias para o pleito</span>` : "");

if (AG.hipotetico){
  const al = document.getElementById("alarme");
  al.hidden = false;
  al.innerHTML =
    `<div class="titulo">Leia antes do número</div>
     <b>Ainda não há pesquisa de 2º turno feita depois do 1º turno.</b> Tudo o que
     esta página mostra vem de cenários hipotéticos, perguntados antes de
     ${dLonga(DIA1T)} a eleitores que ainda não tinham visto o resultado nem a
     campanha recomeçar. E foram essas mesmas pesquisas que erraram a margem do
     1º turno — a mediana ficou <b>5,8 pontos</b> longe do que a urna devolveu,
     e só ${contaAcertos()} de ${Object.keys(D.acuracia_1t).length} acertaram quem estava na frente.
     Trate como ponto de partida, não como medida do 2º turno.`;
}

function contaAcertos(){
  const real = D.resultado_1t[B] - D.resultado_1t[A];
  return Object.values(D.acuracia_1t).filter(d => d.erro_margem > -real).length;
}

/* ------------------------------------------------------------ placar */
(function placar(){
  const m = AG.margem;
  document.getElementById("duelo").innerHTML = `
    <div class="lado">
      <div class="nome">${esc(A)}</div>
      <div class="pct" style="color:var(--a)">${nf1.format(AG.a)}%</div>
      ${m ? `<div class="mg">±${nf1.format(m)}</div>` : ""}
    </div>
    <div class="versus">contra</div>
    <div class="lado dir">
      <div class="nome">${esc(B)}</div>
      <div class="pct" style="color:var(--b)">${nf1.format(AG.b)}%</div>
      ${m ? `<div class="mg">±${nf1.format(m)}</div>` : ""}
    </div>`;

  document.getElementById("barra").innerHTML =
    `<span style="width:${AG.a}%;background:var(--a)">${nf1.format(AG.a)}</span>` +
    `<span class="dir" style="width:${AG.b}%;background:var(--b)">${nf1.format(AG.b)}</span>`;

  const dif = Math.abs(AG.a - AG.b);
  const lider = AG.a > AG.b ? A : B;
  const empate = m != null && dif <= 2 * m;
  const lo = Math.min(AG.a, AG.b) - (m || 0), hi = Math.max(AG.a, AG.b) + (m || 0);
  document.getElementById("veredito").innerHTML = empate
    ? `<b>Empate estatístico.</b> A diferença de ${nf1.format(dif)} ponto cabe dentro da
       margem de ±${nf1.format(m)} — o intervalo de cada candidato cruza os 50%.`
    : `<b>${esc(lider)} à frente por ${nf1.format(dif)} pontos.</b> A diferença é maior que a
       margem de ±${nf1.format(m)}, então não é empate estatístico — mas a margem mede a
       precisão da média, não a distância até a urna.`;
})();

/* ------------------------------------------------------------ gráfico */
const L = {e:46, d:48, t:16, b:30}, W = 900, H = 320;

function grafico(){
  const svg = document.getElementById("g");
  const s = D.serie;
  if (!s.length){ svg.innerHTML = ""; return; }

  const ini = dt(s[0].data), fim = dt(s[s.length-1].data);
  const vals = [];
  s.forEach(p => { vals.push(p.a, p.b); });
  D.historico.forEach(p => { if (dt(p.data) >= ini) vals.push(p.a, p.b); });
  const piso = Math.max(0, Math.floor((Math.min(...vals) - 2) / 5) * 5);
  const teto = Math.min(100, Math.ceil((Math.max(...vals) + 2) / 5) * 5);

  const x = t => L.e + (t - ini) / (fim - ini || 1) * (W - L.e - L.d);
  const y = v => H - L.b - (v - piso) / (teto - piso) * (H - L.t - L.b);

  let g = "";
  for (let v = piso; v <= teto; v += 5){
    const meio = v === 50;
    g += `<line class="${meio?"meio":"grade"}" x1="${L.e}" y1="${y(v)}" x2="${W-L.d}" y2="${y(v)}"/>`;
    g += `<text class="${meio?"rotmeio":""}" x="${L.e-9}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  }
  const dias = Math.round((fim - ini) / DIA);
  const passo = Math.max(1, Math.round(dias / 6));
  for (let k = 0; k <= dias; k += passo){
    const t = ini + k * DIA;
    if (x(t) > W - L.d - 6) continue;
    g += `<text x="${x(t)}" y="${H-L.b+17}" text-anchor="middle">${dCurta(t)}</text>`;
  }
  /* marca o dia do 1º turno: antes dele as pesquisas eram hipotéticas */
  if (DIA1T >= ini && DIA1T <= fim){
    g += `<line class="corte" x1="${x(DIA1T)}" y1="${L.t}" x2="${x(DIA1T)}" y2="${H-L.b}"/>`;
    g += `<text x="${x(DIA1T)}" y="${L.t-4}" text-anchor="middle">1º turno</text>`;
  }

  D.historico.forEach(p => {
    const t = dt(p.data);
    if (t < ini || t > fim) return;
    g += `<circle class="pt pa" cx="${x(t).toFixed(1)}" cy="${y(p.a).toFixed(1)}" r="3"/>`;
    g += `<circle class="pt pb" cx="${x(t).toFixed(1)}" cy="${y(p.b).toFixed(1)}" r="3"/>`;
  });

  [["a","la","ra"],["b","lb","rb"]].forEach(([k, cl, rc]) => {
    const d = s.map((p,i) => `${i?"L":"M"}${x(dt(p.data)).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ");
    g += `<path class="ln ${cl}" d="${d}"/>`;
    const u = s[s.length-1];
    g += `<circle class="fim ${rc==="ra"?"pa":"pb"}" cx="${x(dt(u.data)).toFixed(1)}" cy="${y(u[k]).toFixed(1)}" r="4"/>`;
    g += `<text class="rot ${rc}" x="${(x(dt(u.data))+9).toFixed(1)}" y="${(y(u[k])+4).toFixed(1)}">${nf1.format(u[k])}</text>`;
  });

  g += `<line class="cruz" x1="0" y1="${L.t}" x2="0" y2="${H-L.b}" opacity="0"/>`;
  svg.innerHTML = g;

  document.getElementById("legenda").innerHTML =
    `<span><i class="marca" style="background:var(--a)"></i>${esc(A)}</span>` +
    `<span><i class="marca" style="background:var(--b)"></i>${esc(B)}</span>` +
    `<span style="color:var(--tinta-3)"><i class="marca" style="background:var(--tinta-3);opacity:.4;border-radius:50%;width:8px;height:8px"></i>pesquisa individual</span>`;

  /* tooltip */
  const mold = document.getElementById("moldura"), dica = document.getElementById("dica");
  const cruz = svg.querySelector(".cruz");
  mold.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX ?? ev.touches?.[0]?.clientX) - r.left;
    const t = ini + (px / r.width) * (fim - ini);
    let melhor = s[0];
    s.forEach(p => { if (Math.abs(dt(p.data)-t) < Math.abs(dt(melhor.data)-t)) melhor = p; });
    const xs = x(dt(melhor.data));
    cruz.setAttribute("x1", xs); cruz.setAttribute("x2", xs); cruz.setAttribute("opacity","1");
    const dif = Math.abs(melhor.a - melhor.b);
    dica.innerHTML = `<div class="dica-data">${dLonga(dt(melhor.data))}</div>` +
      `<div class="dica-linha"><i class="marca" style="background:var(--a)"></i>${esc(A)}<span class="v">${nf1.format(melhor.a)}%</span></div>` +
      `<div class="dica-linha"><i class="marca" style="background:var(--b)"></i>${esc(B)}<span class="v">${nf1.format(melhor.b)}%</span></div>` +
      `<div class="dica-linha" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--grade);color:var(--tinta-3);font-size:11.5px">${
        dif < 1 ? "empate" : (melhor.a>melhor.b?esc(A):esc(B)) + " +" + nf1.format(dif)}</div>`;
    dica.classList.add("vis");
    const lg = dica.offsetWidth;
    dica.style.left = Math.min(Math.max(xs/W*r.width - lg/2, 0), r.width - lg) + "px";
    dica.style.top = "6px";
  };
  mold.onmouseleave = () => { dica.classList.remove("vis"); cruz.setAttribute("opacity","0"); };
}
grafico();

document.getElementById("nota-grafico").innerHTML =
  `A média ponderada recalculada dia a dia, em votos válidos. Os pontos são as pesquisas
   individuais. A linha tracejada vertical marca o 1º turno: <b>tudo à esquerda dela é
   cenário hipotético</b>, perguntado antes de o eleitor ver o resultado.`;

/* ------------------------------------------------------------ acurácia */
(function acuracia(){
  const linhas = Object.entries(D.acuracia_1t)
    .map(([inst, d]) => ({inst, ...d}))
    .sort((x, y) => x.erro_abs - y.erro_abs);
  const maxPeso = Math.max(...linhas.map(l => pesoDe(l.erro_abs)));

  document.getElementById("corpo-acuracia").innerHTML = linhas.map(l => {
    const p = pesoDe(l.erro_abs);
    const bom = l.erro_abs <= 2;
    return `<tr>
      <td>${esc(l.inst)}</td>
      <td class="num">${l.data.slice(8,10)}/${l.data.slice(5,7)}</td>
      <td class="num">${nf1.format(l.previsto_a)} x ${nf1.format(l.previsto_b)}</td>
      <td class="erro ${bom?"bom":"ruim"}">${sinal(l.erro_margem)}</td>
      <td class="barra-peso"><i style="width:${p/maxPeso*100}%"></i><span>${nf1.format(p*100)}%</span></td>
    </tr>`;
  }).join("");

  const oficial = `${esc(B)} ${nf1.format(D.resultado_1t[B])}% × ${esc(A)} ${nf1.format(D.resultado_1t[A])}%`;
  document.getElementById("nota-acuracia").innerHTML =
    `No 1º turno a urna deu <b>${oficial}</b>. Comparando com a última pesquisa de cada
     instituto, o erro na margem vai de ${sinal(linhas[0].erro_margem)} a
     ${sinal(linhas[linhas.length-1].erro_margem)} pontos. É esse número que define o
     peso de cada um aqui: <code>1 / (1 + erro / ${nf1.format(D.parametros.erro_referencia)})</code>,
     limitado para que o melhor pese cerca de três vezes o pior — e não trinta, porque
     é uma eleição só.`;
})();

function pesoDe(erroAbs){
  return Math.max(0.25, 1 / (1 + erroAbs / D.parametros.erro_referencia));
}

/* ------------------------------------------------------------ pesquisas */
(function pesquisas(){
  document.getElementById("cab-pesquisas").innerHTML =
    `<th>Instituto</th><th>Campo</th><th>Amostra</th><th>${esc(A)}</th><th>${esc(B)}</th>` +
    `<th>Erro 1º t.</th><th>Peso</th>`;
  const maxP = Math.max(...D.pesquisas_janela.map(p => p.peso_pct));
  document.getElementById("corpo-pesquisas").innerHTML = D.pesquisas_janela.map(p => `
    <tr>
      <td>${esc(p.instituto)}${p.medido ? "" : '<span class="pastilha">sem medida</span>'}</td>
      <td class="num">${p.data.slice(8,10)}/${p.data.slice(5,7)}</td>
      <td class="num">${p.amostra ? nf0.format(p.amostra) : "—"}</td>
      <td class="num">${nf1.format(p.a)}</td>
      <td class="num">${nf1.format(p.b)}</td>
      <td class="erro ${p.erro_1t!=null && Math.abs(p.erro_1t)<=2 ? "bom":"ruim"}">${
        p.erro_1t != null ? sinal(p.erro_1t) : "—"}</td>
      <td class="barra-peso"><i style="width:${p.peso_pct/maxP*100}%"></i><span>${nf1.format(p.peso_pct)}%</span></td>
    </tr>`).join("");

  document.getElementById("nota-pesquisas").innerHTML =
    `Janela de <b>${D.parametros.janela_dias} dias</b>, com meia-vida de
     ${D.parametros.meia_vida_dias} — mais curtas que as do 1º turno, porque a campanha de
     2º turno é curta e tudo se move mais rápido. Institutos sem pesquisa na reta final do
     1º turno não têm erro medido e recebem o peso mediano
     (${nf1.format(D.parametros.peso_sem_medida*100)}%), nem prêmio nem castigo.`;
})();

/* ------------------------------------------------------------ rodapé */
document.getElementById("rodape").innerHTML = `
  <p><b>O que mudou depois do 1º turno.</b> Até 4 de outubro o peso de cada instituto vinha
  de um ranking de acurácia montado <em>antes</em> da eleição, e só cinco institutos
  entravam. Aquele ranking falhou: o melhor colocado dele ficou em 17º entre 19, e um
  instituto que estava fora do recorte empatou em 1º. Agora todos entram, e o peso vem do
  erro medido em 4/10.</p>

  <p><b>A margem, e o que ela não cobre.</b> ±${AG.margem != null ? nf1.format(AG.margem) : "—"}
  é o erro padrão da média ponderada a 95%, calculado da discordância entre os institutos
  dividida pela raiz do número efetivo de pesquisas. Ela mede a precisão da média,
  <b>não a distância até a urna</b> — viés que todos compartilhem passa inteiro, e foi
  exatamente isso que aconteceu no 1º turno, quando 19 institutos erraram na mesma direção.</p>

  <p><b>Por que o 2º turno costuma errar menos.</b> Uma aferição contra 2018 e 2022, no
  histórico deste repositório, mostrou viés de 6,0 e 3,8 pontos no 1º turno e praticamente
  zero no 2º. Com dois nomes só, sem terceira via para inflar, os institutos convergem.
  É motivo para esperar menos erro agora — não garantia.</p>

  <p><b>Fonte.</b> Tabelas de pesquisas da Wikipédia para a eleição presidencial de 2026,
  que citam o registro de cada pesquisa no TSE. Resultado do 1º turno: TSE. Coleta e
  cálculo em <span style="font-family:var(--mono)">coletar.py</span>,
  <span style="font-family:var(--mono)">aferir_1t.py</span> e
  <span style="font-family:var(--mono)">agregar.py</span>.</p>

  <p style="margin-top:14px;color:var(--tinta-3)">Gerado em ${dLonga(dt(D.atualizado))}.</p>`;
})();
</script>
