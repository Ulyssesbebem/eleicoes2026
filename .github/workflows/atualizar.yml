name: Atualizar agregador

on:
  schedule:
    # Reta final: seis execuções por dia, a cada 4h (BRT = UTC-3).
    #
    # O cron do GitHub é melhor esforço e atrasa de 2h a 5h quando a fila está
    # cheia, então o espaçamento real é maior que o nominal. Com duas execuções
    # por dia, uma pesquisa publicada às 22h de sábado só apareceria no domingo
    # ao meio-dia - no dia da eleição. Pesquisa de véspera costuma sair entre
    # 20h e 22h, que é exatamente a faixa mal coberta.
    #
    # Depois do 2º turno dá para voltar a "0 11" e "0 23" e poupar execuções.
    - cron: "0 1 * * *"     # 22h BRT
    - cron: "0 3 * * *"     # 00h BRT
    - cron: "0 11 * * *"    # 08h BRT
    - cron: "0 15 * * *"    # 12h BRT
    - cron: "0 19 * * *"    # 16h BRT
    - cron: "0 23 * * *"    # 20h BRT
  push:
    branches: [main]
  workflow_dispatch:

# só uma execução por vez: duas rodando juntas brigariam pelo commit
concurrency:
  group: atualizar-agregador
  cancel-in-progress: false

permissions:
  contents: write      # para commitar os CSVs atualizados
  pages: write         # para publicar no GitHub Pages
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # os scripts só usam a biblioteca padrão - não há dependências a instalar

      - name: Coletar pesquisas de 2026
        run: python coletar.py

      - name: Medir o erro de cada instituto no 1º turno
        run: python aferir_1t.py

      - name: Agregar
        run: python agregar.py

      - name: Conferir se os dados fazem sentido
        run: python verificar.py

      - name: Montar o site
        run: python montar_site.py

      # O site sobe ANTES de guardar os dados. Publicar é o objetivo; versionar
      # os CSVs é arquivamento. Em 23/09 a ordem inversa derrubou o deploy
      # inteiro porque o push falhou, e o site ficou uma semana parado com o
      # pipeline "verde" até o passo 12.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar os dados atualizados no repositório
        continue-on-error: true      # nunca pode bloquear a publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pesquisas_*.csv agregado.json acuracia_2026.json

          if git diff --staged --quiet; then
            echo "Nenhuma pesquisa nova."
            exit 0
          fi

          git commit -m "Dados: atualização automática de $(date -u +'%d/%m/%Y %H:%M') UTC"

          # o push pode ser recusado se o remoto andou desde o checkout
          for tentativa in 1 2 3; do
            if git push; then
              echo "Enviado na tentativa $tentativa."
              exit 0
            fi
            echo "Push recusado; trazendo o remoto e tentando de novo..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "::warning::Não consegui versionar os dados desta execução."
          echo "O site foi publicado assim mesmo."

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
