name: Atualizar agregador

on:
  schedule:
    # 08h e 20h de Brasília (o cron do GitHub roda em UTC; BRT = UTC-3)
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      atualizar_historico:
        description: "Rebaixar também as pesquisas de 2018 e 2022"
        type: boolean
        default: false

# só uma execução por vez: duas rodando juntas brigariam pelo commit
concurrency:
  group: atualizar-agregador
  cancel-in-progress: false

permissions:
  contents: write      # para commitar os CSVs atualizados
  pages: write         # para publicar no GitHub Pages
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # os scripts só usam a biblioteca padrão - não há dependências a instalar

      - name: Coletar pesquisas de 2026
        run: python coletar.py

      - name: Coletar histórico de 2018 e 2022
        if: inputs.atualizar_historico
        run: python coletar_historico.py

      - name: Agregar
        run: python agregar.py

      - name: Aferir contra as urnas
        run: python aferir.py

      - name: Coletar resultado de 2022 por estado
        if: inputs.atualizar_historico
        run: python coletar_uf.py

      - name: Projetar por estado
        run: python projetar_uf.py

      - name: Conferir se os dados fazem sentido
        run: python verificar.py

      - name: Montar o site
        run: python montar_site.py

      # O site sobe ANTES de guardar os dados. Publicar é o objetivo; versionar
      # os CSVs é arquivamento. Em 23/09 a ordem inversa derrubou o deploy
      # inteiro porque o push falhou, e o site ficou uma semana parado com o
      # pipeline "verde" até o passo 12.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar os dados atualizados no repositório
        continue-on-error: true      # nunca pode bloquear a publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pesquisas_*.csv resultados_2022_uf.csv agregado.json afericao.json projecao_uf.json

          if git diff --staged --quiet; then
            echo "Nenhuma pesquisa nova."
            exit 0
          fi

          git commit -m "Dados: atualização automática de $(date -u +'%d/%m/%Y %H:%M') UTC"

          # o push pode ser recusado se o remoto andou desde o checkout
          for tentativa in 1 2 3; do
            if git push; then
              echo "Enviado na tentativa $tentativa."
              exit 0
            fi
            echo "Push recusado; trazendo o remoto e tentando de novo..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "::warning::Não consegui versionar os dados desta execução."
          echo "O site foi publicado assim mesmo."

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
